
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính điểm học phần</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f6fc;
            margin: 0;
            color: #222;
        }

        nav {
            background: #1769aa;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 8px 12px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000015;
        }

        h1 {
            text-align: center;
            color: #1769aa;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input, button {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            background: #1769aa;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0d4778;
        }

        .ket-qua {
            margin-top: 20px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 6px;
            line-height: 1.8;
        }

        .loi {
            color: #c62828;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <nav>
        <a href="/">Trang chủ</a>
        <a href="/may-tinh">Bài 1: Máy tính</a>
        <a href="/tinh-diem">Bài 2: Tính điểm</a>
        <a href="/bmi">Bài 3: Tính BMI</a>
    </nav>

    <div class="container">
        <h1>Tính điểm học phần</h1>
        <p>Nhập điểm theo thang điểm 10.</p>

        <form method="POST">
            <label for="diem_cc">Điểm chuyên cần (10%):</label>
            <input type="number" step="any" min="0" max="10"
                   id="diem_cc" name="diem_cc" required>

            <label for="diem_gk">Điểm giữa kỳ (30%):</label>
            <input type="number" step="any" min="0" max="10"
                   id="diem_gk" name="diem_gk" required>

            <label for="diem_ck">Điểm cuối kỳ (60%):</label>
            <input type="number" step="any" min="0" max="10"
                   id="diem_ck" name="diem_ck" required>

            <button type="submit">Tính điểm</button>
        </form>

        {% if diem_trung_binh is not none %}
            <div class="ket-qua">
                <strong>Điểm trung bình:</strong>
                {{ "%.2f"|format(diem_trung_binh) }}<br>

                <strong>Điểm chữ:</strong> {{ diem_chu }}<br>

                <strong>Xếp loại:</strong> {{ ket_qua }}
            </div>
        {% endif %}

        {% if loi %}
            <p class="loi">{{ loi }}</p>
        {% endif %}
    </div>
</body>
</html>
