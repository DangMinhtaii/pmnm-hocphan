
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy tính cơ bản</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f6fc;
            margin: 0;
            color: #222;
        }

        nav {
            background: #1769aa;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 8px 12px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000015;
        }

        h1 {
            text-align: center;
            color: #1769aa;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input, select, button {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            background: #1769aa;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0d4778;
        }

        .ket-qua {
            margin-top: 20px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 6px;
            overflow-wrap: anywhere;
        }

        .loi {
            color: #c62828;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <nav>
        <a href="/">Trang chủ</a>
        <a href="/may-tinh">Bài 1: Máy tính</a>
        <a href="/tinh-diem">Bài 2: Tính điểm</a>
        <a href="/bmi">Bài 3: Tính BMI</a>
    </nav>

    <div class="container">
        <h1>Máy tính cơ bản</h1>

        <form method="POST">
            <label for="so_a">Số thứ nhất:</label>
            <input type="number" step="any" id="so_a"
                   name="so_a" required>

            <label for="so_b">Số thứ hai:</label>
            <input type="number" step="any" id="so_b"
                   name="so_b" required>

            <label for="phep_tinh">Chọn phép tính:</label>
            <select id="phep_tinh" name="phep_tinh" required>
                <option value="cong">Cộng (+)</option>
                <option value="tru">Trừ (-)</option>
                <option value="nhan">Nhân (×)</option>
                <option value="chia">Chia (÷)</option>
            </select>

            <button type="submit">Tính kết quả</button>
        </form>

        {% if ket_qua is not none %}
            <div class="ket-qua">
                <strong>Kết quả: {{ ket_qua }}</strong>
            </div>
        {% endif %}

        {% if loi %}
            <p class="loi">{{ loi }}</p>
        {% endif %}
    </div>
</body>
</html>
